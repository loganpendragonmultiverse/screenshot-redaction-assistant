[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-redaction-assistant"
version = "1.1.0"
description = "Batch, preview, review, and permanently redact screenshots locally with audit evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["Pillow>=12.3,<13"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
ocr = ["pytesseract>=0.3.13,<1"]

[project.scripts]
redact-screenshot = "screenshot_redaction_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
omit = ["src/*/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=screenshot_redaction_assistant --cov-branch --cov-report=term-missing --cov-fail-under=90"
